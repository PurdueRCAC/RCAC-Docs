name: Run Make on modulefiles and tools change (GitHub App)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'modulefiles/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # we'll use our own token instead of GITHUB_TOKEN

      - name: Generate GitHub App installation token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.PURDUERCAC_DOCS_BOT_APP_ID }}
          private_key: ${{ secrets.PURDUERCAC_DOCS_BOT_PRIVATE_KEY }}

      - name: Configure git identity
        run: |
          git config user.name "purduercac-docs-bot"
          git config user.email "purduercac-docs-bot@users.noreply.github.com"
          git pull

      - name: Run make
        run: make

      - name: Commit and push changes (using App token)
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Stage files we want to commit
          git add ../docs/software/apps_md ../docs/software/app_catalog.md ../docs/software/index.md apps_descriptions.json ../docs/software/ngc_md ../docs/software/ngc_catalog.md ../docs/software/rocm_md ../docs/software/rocm_catalog.md || true

          # Stash everything (staged + unstaged) so rebase sees a fully clean tree
          git stash || true

          # Pull and rebase cleanly
          git pull origin ${{ github.ref_name }} --rebase

          # Restore stash and reinstate the index (staged) state
          git stash pop --index || true

          # Re-stage as a safety net in case pop --index couldn't restore the index
          git add ../docs/software/apps_md ../docs/software/app_catalog.md ../docs/software/index.md apps_descriptions.json ../docs/software/ngc_md ../docs/software/ngc_catalog.md ../docs/software/rocm_md ../docs/software/rocm_catalog.md || true
          
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update app catalog and markdown files"
          git push https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}
