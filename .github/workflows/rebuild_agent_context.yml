name: Rebuild agentic-AI context on data-model change (GitHub App)

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'tools/agent_context/**'
      - 'tools/generate_agent_context.py'

permissions:
  contents: write

jobs:
  rebuild-agent-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App installation token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.PURDUERCAC_DOCS_BOT_APP_ID }}
          private_key: ${{ secrets.PURDUERCAC_DOCS_BOT_PRIVATE_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 pyyaml

      - name: Configure git identity
        run: |
          git config user.name "purduercac-docs-bot"
          git config user.email "purduercac-docs-bot@users.noreply.github.com"
          git pull

      - name: Regenerate agentic-AI context
        run: python tools/generate_agent_context.py

      - name: Commit and push regenerated context (using App token)
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Stage the regenerated tree before pulling
          git add docs/snippets/agentic-ai || true

          # Sync with branch to avoid rebase errors
          git pull origin ${{ github.ref_name }} --rebase || git pull origin ${{ github.ref_name }}

          # Re-stage in case of merge/rebase updates
          git add docs/snippets/agentic-ai || true

          # Skip commit if no changes
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Auto-regenerate agentic-AI context after data-model change"
          git push https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${{ github.repository }} HEAD:${{ github.ref_name }}
